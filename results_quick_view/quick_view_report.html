<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur JSON</title>
</head>
<body>
    <h1 id="error-title"></h1>
    <table id="error-list"></table>

    <script>
        // Fonction pour charger le fichier JSON et afficher les erreurs
        function loadErrors() {
            fetch('/data') // Le chemin vers le fichier JSON
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const errorTitle = document.getElementById('error-title');
					errorTitle.append(data.title);
					const errorList = document.getElementById('error-list');
					console.log(data.sources);
                    data.sources["sample_xml"].E_VALIDATION.forEach(error => {
                        const row = document.createElement('tr');
                        const id = document.createElement('td');
                        id.textContent = `${error.file} / ${error.data.id} `;
						row.appendChild(id)
                        const message = document.createElement('td');
                        message.textContent = `${error.message}`;
						row.appendChild(message)
                        const path = document.createElement('td');
                        path.textContent = `${error.path}`;
						row.appendChild(path)
                        const errorMsg = document.createElement('td');
                        errorMsg.textContent = `${error.error}`;
						row.appendChild(errorMsg)
                        const dataMsg = document.createElement('td');
                        dataMsg.textContent = JSON.stringify(error.data,null,2);
						row.appendChild(dataMsg)
                        errorList.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Il y a eu un problème avec le chargement du JSON:', error);
                });
        }

        // Charger les erreurs lors du chargement de la page
        window.onload = loadErrors;
    </script>
</body>
</html>
